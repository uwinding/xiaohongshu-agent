{% extends "base.html" %}
{% block title %}趋势数据{% endblock %}
{% block content %}
<h1>趋势数据</h1>
<table>
    <thead><tr><th>关键词</th><th>品类</th><th>热度</th><th>获取时间</th></tr></thead>
    <tbody>
        {% if trends %}
            {% for t in trends %}
            <tr>
                <td>{{ t.keyword }}</td><td>{{ t.category }}</td><td>{{ t.hot_score }}</td><td>{{ t.fetch_date[:19] if t.fetch_date }}</td>
            </tr>
            {% endfor %}
        {% else %}
            <tr><td colspan="4" style="text-align:center; color:#999;">暂无趋势数据</td></tr>
        {% endif %}
    </tbody>
</table>
{% endblock %}
